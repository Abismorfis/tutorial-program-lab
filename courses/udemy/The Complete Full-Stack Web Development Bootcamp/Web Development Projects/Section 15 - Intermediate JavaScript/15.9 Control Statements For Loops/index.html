<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15.9 Control Statements For Loops</title>
</head>
<body>
</body>
<script>
    // Control Statements While Loops
    let j = 0;
    while (j < 10) {
        if (j === 5) {
            break;
        }
        console.log(j);
        j++;
    }

    // Control Statements For Loops
    // break statement
    for (let i = 0; i < 10; i++) {
        if (i === 5) {
            break;
        }
        console.log(i);
    }
    
    // continue statement
    for (let i = 0; i < 10; i++) {
        if (i === 5) {
            continue;
        }
        console.log(i);
    }
</script>
</html>
