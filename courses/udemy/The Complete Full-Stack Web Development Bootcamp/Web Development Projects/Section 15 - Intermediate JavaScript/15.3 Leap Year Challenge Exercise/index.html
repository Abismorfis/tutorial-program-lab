<script>
    const leapYear = {
        '2400': isLeap(2400),
        '1989': isLeap(1989)
    }

    function isLeap(year) {
        const divisible = [4, 100, 400];
        
        const result = divisible.map(item => year % item).some(item => item === 0);
        
        return result ? 'Leap year.' : 'Not leap year.';
    }

    console.log(leapYear['2400']);
    console.log(leapYear['1989']);
</script>
