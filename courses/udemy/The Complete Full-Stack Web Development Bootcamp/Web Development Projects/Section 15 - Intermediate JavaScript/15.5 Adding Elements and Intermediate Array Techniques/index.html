<body>
</body>
<script>
    var output = [];
    var count = 1;

    function fizzBuzz(num) {
        for (var i = 1; i <= num; i++) {
            if (i % 3 === 0 && i % 5 === 0) {
                output.push("FizzBuzz");
            } else if (i % 3 === 0) {
                output.push("Fizz");
            } else if (i % 5 === 0) {
                output.push("Buzz");
            } else {
                output.push(i);
            }
        }
        return output;
    }

    console.log(fizzBuzz(15));
</script>
